<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheatreX</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
  
   <div class="head">
    <img class="icon" src="icon1.jpeg" alt="icon">
    <input class="search" placeholder="search">
    <select name="location" class="location">
      <option>Select city</option>
    <option>Mumbai</option>
<option>Delhi</option>
<option>Chennai</option>
<option>Banglore</option>
</select>
<button class="getStarted">Get started</button>
  </div>




<nav class="navbar">
    <div class="nav-right">
        <a href="#">Movies</a>
        <a href="#">Events</a>
        <a href="#">Plays</a>
        <a href="#">Sports</a>
        <a href="#">Activities</a>
</div>
 <div class="nav-right">
        <a href="#">Offers</a>
        <a href="#">About Us</a>
    </div>
</nav>
<section class="movie-section">

    <aside class="filters" id="filters">

        <h2>Filters</h2>

        <details class="filter-group">
            <summary>Genre</summary>

            <label>
                <input type="checkbox" name="genre" value="Action">
                Action
            </label>

            <label>
                <input type="checkbox" name="genre" value="Comedy">
                Comedy
            </label>

            <label>
                <input type="checkbox" name="genre" value="Drama">
                Drama
            </label>

            <label>
                <input type="checkbox" name="genre" value="Thriller">
                Thriller
            </label>

            <label>
                <input type="checkbox" name="genre" value="Romance">
                Romance
            </label>

            <label>
                <input type="checkbox" name="genre" value="Horror">
                Horror
            </label>
        </details>


        <details class="filter-group">
            <summary>Budget</summary>

            <label>
                <input type="radio" name="budget" value="under200">
                Under ₹200
            </label>

            <label>
                <input type="radio" name="budget" value="200-400">
                ₹200 - ₹400
            </label>

            <label>
                <input type="radio" name="budget" value="400-600">
                ₹400 - ₹600
            </label>

            <label>
                <input type="radio" name="budget" value="above600">
                ₹600+
            </label>
        </details>


        <details class="filter-group">
            <summary>Language</summary>

            <label>
                <input type="checkbox" name="language" value="Hindi">
                Hindi
            </label>

            <label>
                <input type="checkbox" name="language" value="English">
                English
            </label>

            <label>
                <input type="checkbox" name="language" value="Marathi">
                Marathi
            </label>

            <label>
                <input type="checkbox" name="language" value="Tamil">
                Tamil
            </label>

            <label>
                <input type="checkbox" name="language" value="Telugu">
                Telugu
            </label>
        </details>

    </aside>

</section>
</body>
</html>
